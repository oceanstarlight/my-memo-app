<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Memo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 메인 소개 페이지 (접속 시 처음 보이는 화면) -->
  <section id="main-page" class="page-view active">
    <div class="welcome-box">
      <h1>☁️ Cloud Memo App</h1>
      <p>메모를 남기면 AI가 요약하고 태그를 붙여 깔끔하게 정리해 드립니다.</p>
      <button id="go-to-login-btn" class="primary-btn">시작하기</button>
    </div>
  </section>

  <!-- 2. 로그인 페이지 -->
  <section id="login-page" class="page-view">
    <div class="login-box">
      <h2>로그인</h2>
      <p>서비스를 이용하려면 구글 계정으로 로그인하세요.</p>
      <button id="google-login-btn" class="google-btn">
        <img src="google-icon.webp" alt="Google icon" width="18">
        Google 계정으로 로그인
      </button>
      <button id="back-to-main-btn" class="text-btn">뒤로 가기</button>
    </div>
  </section>

  <!-- 3. 실제 메모 페이지 (3단 구조) -->
  <section id="memo-page" class="page-view">
    <div class="app-container">

      <aside class="sidebar-left">
        <div class="user-profile">
          <span id="user-name">사용자님</span>
          <button id="logout-btn" class="secondary-btn">로그아웃</button>
        </div>

        <button id="toggle-left-btn" class="sidebar-toggle-btn left-trigger">◀</button>

        <div class="folder-directory">
          <h3>📂 폴더 및 메모</h3>
          <button class="add-folder-btn">+ 새 폴더</button>
          <div class="editor-buttons">
            <button id="new-memo-btn" class="action-btn">새 메모 작성</button>
            <button id="select-mode-btn" class="action-btn secondary-select-btn">메모 선택</button>
          </div>

          <button id="all-memos-btn" class="all-memos-btn">🗂️ 모든 메모</button>
          <ul id="folder-list"></ul>

          <div class="memo-control-box">
            <button id="delete-btn" class="control-btn delete-btn">🗑️  메모 / 폴더 삭제</button>
          </div>
        </div>
        <div class="sidebar-setting-box">
          <label for="view-option-select">뷰 설정</label>
          <select id="view-option-select" class="setting-select">
            <option value="list-on-grid-off">목록에서 파일 보여주기 + 그리드 미사용</option>
            <option value="list-off-grid-on">목록에서 파일 숨기기 + 그리드 사용</option>
          </select>
        </div>
      </aside>

      <!-- 중앙: 메모 입력 콘솔 / 폴더 대시보드 -->
      <main class="memo-center">

        <button id="memo-back-btn" class="secondary-btn memo-back-btn">뒤로가기</button>

        <div class="memo-form" id="memo-editor-form">
          <input type="text" id="memo-title" placeholder="제목 없는 메모">
          <textarea id="memo-content" placeholder="여기에 생각을 기록하세요..."></textarea>
          <div class="form-footer">
            <div class="footer-info">
              <div class="char-counter">공백 포함: <span id="char-count">0</span>자</div>
              <span id="save-status" class="save-status"></span>
            </div>
            <button id="save-btn" class="primary-btn">수정</button>
          </div>
        </div>

        <div class="folder-dashboard" id="folder-dashboard">
          <div class="dashboard-header">
            <h2 id="current-folder-title">폴더 이름</h2>
            <p class="dashboard-desc" id="dashboard-desc"></p>
            <input type="search" id="dashboard-search" class="dashboard-search" placeholder="🔍 제목 · 내용 · 요약 · 태그 검색">
            <div id="tag-filter" class="tag-list tag-filter"></div>
          </div>
          <div class="file-grid" id="dashboard-file-list"></div>
        </div>

      </main>

      <!-- 오른쪽: AI 정리 패널 -->
      <aside class="sidebar-right">
        <button id="toggle-right-btn" class="sidebar-toggle-btn right-trigger">▶</button>

        <div class="ai-tools-container">
          <h3>✨ AI 정리</h3>
          <p class="ai-desc">메모를 저장하면 AI가 자동으로 요약하고 태그와 카테고리를 붙여 줍니다.</p>

          <hr class="ai-divider">

          <div id="ai-panel-empty" class="ai-empty">메모를 열면 AI 정리 결과가 여기에 표시됩니다.</div>

          <div id="ai-panel" class="ai-panel" hidden>
            <div class="ai-panel-head">
              <span id="ai-category" class="category-badge"></span>
              <span id="ai-status" class="ai-status"></span>
            </div>
            <div id="ai-result" class="ai-result">
              <section class="ai-section">
                <h4>요약</h4>
                <p id="ai-summary" class="ai-result-text"></p>
              </section>
              <section class="ai-section">
                <h4>핵심 내용</h4>
                <ul id="ai-keypoints" class="ai-keypoints"></ul>
              </section>
              <section class="ai-section">
                <h4>태그</h4>
                <div id="ai-tags" class="tag-list"></div>
              </section>
            </div>
            <button id="ai-analyze-btn" class="ai-action-btn">🔄 지금 다시 분석하기</button>
          </div>
        </div>
      </aside>

    </div>
  </section>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>
</body>
</html>
